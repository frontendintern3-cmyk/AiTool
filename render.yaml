services:
  - type: web
    name: seo-audit-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seo-audit-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false

databases:
  - name: seo-audit-db
    databaseName: audit_platform
    user: audit
    plan: free
